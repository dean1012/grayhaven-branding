<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Grayhaven Systems LLC Icon Preview</title>
    <link rel="stylesheet" href="../web/style-guide/fonts.css?v=20260830">
    <link
      rel="stylesheet"
      href="../web/style-guide/fontawesome.min.css?v=20260830"
   >
    <link rel="stylesheet" href="../web/shared-components.css?v=20260915a">
    <link rel="stylesheet" href="preview.css?v=20261021">
  </head>
  <body>
    <header class="icon-preview-header">
      <nav
        class="icon-preview-header-inner"
        aria-label="Icon preview navigation"
      >
        <a
          class="icon-preview-brand"
          href="./index.html"
          aria-label="Grayhaven Systems LLC icon preview home"
        >
          <img
            src="../logo/svg/grayhaven-logo-wordmark-dark.svg"
            alt="Grayhaven Systems LLC"
         >
        </a>
        <a
          class="button button-secondary icon-preview-source"
          href="../docs/icon-usage.md"
          aria-label="Back to Icon Usage"
        >
          <i class="fa-solid fa-arrow-left" aria-hidden="true"></i>
          <span>Back to Icon Usage</span>
        </a>
      </nav>
    </header>
    <main class="icon-preview-main">
      <header class="icon-preview-intro">
        <p class="eyebrow">ICON PREVIEW</p>
        <h1>Grayhaven Systems LLC icons</h1>
        <p class="muted">
          Service and automation icons on light and dark surfaces.
        </p>
      </header>
      <div class="icon-preview-grid">
        <section
          class="icon-preview-card icon-preview-card-light"
          aria-labelledby="light-discord-webhook-title"
        >
          <h2 id="light-discord-webhook-title">Discord webhook on a light background</h2>
          <div class="icon-preview-artwork">
            <img
              class="icon"
              src="svg/discord-webhook-icon.svg"
              alt="Grayhaven Systems LLC Discord webhook icon on a light background"
           >
          </div>
        </section>
        <section
          class="icon-preview-card"
          aria-labelledby="dark-discord-webhook-title"
        >
          <h2 id="dark-discord-webhook-title">Discord webhook on a dark background</h2>
          <div class="icon-preview-artwork">
            <img
              class="icon"
              src="svg/discord-webhook-icon.svg"
              alt="Grayhaven Systems LLC Discord webhook icon on a dark background"
           >
          </div>
        </section>
        <section
          class="icon-preview-card icon-preview-card-light"
          aria-labelledby="light-mcp-title"
        >
          <h2 id="light-mcp-title">MCP connection on a light background</h2>
          <div class="icon-preview-artwork">
            <img
              class="icon"
              src="svg/grayhaven-mcp-icon.svg"
              alt="Grayhaven Systems LLC MCP icon on a light background"
           >
          </div>
        </section>
        <section
          class="icon-preview-card"
          aria-labelledby="dark-mcp-title"
        >
          <h2 id="dark-mcp-title">MCP connection on a dark background</h2>
          <div class="icon-preview-artwork">
            <img
              class="icon"
              src="svg/grayhaven-mcp-icon.svg"
              alt="Grayhaven Systems LLC MCP icon on a dark background"
           >
          </div>
        </section>
      </div>
    </main>
  </body>
</html>
