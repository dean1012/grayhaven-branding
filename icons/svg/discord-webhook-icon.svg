<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Discord webhook automation icon</title>
  <desc id="desc">A rounded square icon showing an automation flow between an infrastructure cube, warning indicator, and Ansible symbol.</desc>

  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="72%">
      <stop offset="0%" stop-color="#2A2F36"/>
      <stop offset="46%" stop-color="#171B20"/>
      <stop offset="100%" stop-color="#050607"/>
    </radialGradient>

    <linearGradient id="panel" x1="110" x2="914" y1="120" y2="904" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1C1F24"/>
      <stop offset="52%" stop-color="#0E1115"/>
      <stop offset="100%" stop-color="#050607"/>
    </linearGradient>

    <linearGradient id="blueLine" x1="180" x2="860" y1="260" y2="720" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#9FE8D6"/>
      <stop offset="42%" stop-color="#B7C9FF"/>
      <stop offset="100%" stop-color="#90CFF7"/>
    </linearGradient>

    <linearGradient id="cubeFaceA" x1="185" x2="380" y1="390" y2="570" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#86FFC8"/>
      <stop offset="100%" stop-color="#2EC87B"/>
    </linearGradient>

    <linearGradient id="cubeFaceB" x1="260" x2="395" y1="410" y2="595" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#B6FF8D"/>
      <stop offset="100%" stop-color="#48B95C"/>
    </linearGradient>

    <linearGradient id="cubeTop" x1="190" x2="360" y1="335" y2="450" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#BFFFF0"/>
      <stop offset="100%" stop-color="#8EF1A0"/>
    </linearGradient>

    <linearGradient id="warning" x1="512" x2="512" y1="350" y2="555" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFF36A"/>
      <stop offset="58%" stop-color="#FFC52D"/>
      <stop offset="100%" stop-color="#FF931F"/>
    </linearGradient>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#181316" flood-opacity=".45"/>
    </filter>

    <filter id="warmGlow" x="-55%" y="-55%" width="210%" height="210%">
      <feGaussianBlur stdDeviation="24" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="1 0 0 0 1  0 .72 0 0 .54  0 0 .05 0 .05  0 0 0 .75 0"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="roundedPanelClip">
      <rect x="88" y="92" width="848" height="840" rx="132"/>
    </clipPath>

    <style>
      .ink {
        stroke: #181820;
        stroke-width: 4;
        stroke-linejoin: round;
      }

      .line {
        fill: none;
        stroke: url(#blueLine);
        stroke-width: 14;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .line-soft {
        fill: none;
        stroke: #221A22;
        stroke-width: 20;
        stroke-linecap: round;
        stroke-linejoin: round;
        opacity: .55;
      }

      .node {
        fill: #93D3F6;
        stroke: #1B1D27;
        stroke-width: 4;
      }
    </style>
  </defs>

  <rect x="88" y="92" width="848" height="840" rx="132" fill="url(#panel)" stroke="#3D4650" stroke-width="5"/>
  <rect x="96" y="99" width="832" height="826" rx="124" fill="none" stroke="#E6EAF0" stroke-opacity=".22" stroke-width="2"/>

  <g clip-path="url(#roundedPanelClip)">
    <rect x="88" y="92" width="848" height="840" rx="132" fill="url(#bgGlow)" opacity=".72"/>

    <g filter="url(#softShadow)">
    <path class="line-soft" d="M428 246h214c36 0 63 24 65 58l2 29c37-2 71 5 101 21"/>
    <path class="line" d="M428 246h214c36 0 63 24 65 58l2 29c37-2 71 5 101 21"/>

    <path class="line-soft" d="M166 394l95-48a38 38 0 0 1 35 1l57 31c19 10 30 30 30 51v17h38"/>
    <path class="line" d="M166 394l95-48a38 38 0 0 1 35 1l57 31c19 10 30 30 30 51v17h38"/>

    <path class="line-soft" d="M267 598v29c0 24 20 44 44 44h294"/>
    <path class="line" d="M267 598v29c0 24 20 44 44 44h294"/>

    <path class="line-soft" d="M606 446h32c6-65 61-116 127-116 17 0 33 3 48 9"/>
    <path class="line" d="M606 446h32c6-65 61-116 127-116 17 0 33 3 48 9"/>

    <path class="line-soft" d="M617 483h24"/>
    <path class="line" d="M617 483h24"/>

    <path class="line-soft" d="M307 268l39-17"/>
    <path class="line" d="M307 268l39-17"/>

    <path class="line-soft" d="M689 650l22-10"/>
    <path class="line" d="M689 650l22-10"/>
    </g>

    <g>
    <circle class="node" cx="270" cy="294" r="31"/>
    <circle cx="270" cy="294" r="21" fill="#A7DCF9" opacity=".65"/>
    <circle class="node" cx="387" cy="244" r="26"/>
    <circle cx="387" cy="244" r="18" fill="#A7DCF9" opacity=".65"/>
    <circle class="node" cx="823" cy="338" r="24"/>
    <circle cx="823" cy="338" r="15" fill="#B4E0FA" opacity=".72"/>
    <circle class="node" cx="649" cy="669" r="29"/>
    <circle cx="649" cy="669" r="20" fill="#A7DCF9" opacity=".65"/>
    <circle class="node" cx="756" cy="630" r="27"/>
    <circle cx="756" cy="630" r="18" fill="#A7DCF9" opacity=".65"/>
    </g>

    <g transform="translate(157 344)" filter="url(#softShadow)">
    <path d="M111 0 0 55v122l111 64 111-64V55Z" fill="none" stroke="#1A1D22" stroke-width="19" stroke-linejoin="round"/>
    <path d="M111 0 0 55v122l111 64 111-64V55Z" fill="none" stroke="url(#blueLine)" stroke-width="11" stroke-linejoin="round"/>
    <path class="ink" d="M112 30 29 72l83 40 83-40Z" fill="url(#cubeTop)"/>
    <path class="ink" d="M29 88v80l70 40v-83Z" fill="url(#cubeFaceA)"/>
    <path class="ink" d="M195 88v80l-70 40v-83Z" fill="url(#cubeFaceB)"/>
    </g>

    <g filter="url(#warmGlow)">
    <path d="M491 365c10-18 32-18 42 0l90 157c10 18-3 40-24 40H425c-21 0-34-22-24-40Z" fill="url(#warning)" stroke="#1E1A18" stroke-width="5" stroke-linejoin="round"/>
    <path d="M491 365c10-18 32-18 42 0l90 157c10 18-3 40-24 40H425c-21 0-34-22-24-40Z" fill="none" stroke="#FFF6A4" stroke-width="12" stroke-linejoin="round" opacity=".82"/>
    <rect x="500" y="408" width="25" height="70" rx="10" fill="#FFF0A3" stroke="#8B5B1D" stroke-width="3"/>
    <circle cx="512.5" cy="514" r="13" fill="#FFF0A3" stroke="#8B5B1D" stroke-width="3"/>
    </g>

    <g transform="translate(637 341)" filter="url(#softShadow)">
    <circle cx="123" cy="123" r="117" fill="#EDE3E5" fill-opacity=".34" stroke="#1D1B24" stroke-width="5"/>
    <circle cx="123" cy="123" r="107" fill="none" stroke="url(#blueLine)" stroke-width="10"/>
    <path d="M84 176 121 70c2-6 10-6 12 0l43 106-47-31-21-15-18 46Z" fill="#FAF8F0" stroke="#1D1B24" stroke-width="4" stroke-linejoin="round"/>
    <path d="M109 128 133 92l24 67Z" fill="#E8DFDE" stroke="#1D1B24" stroke-width="3" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
