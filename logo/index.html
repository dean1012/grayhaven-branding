<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Grayhaven Systems LLC Logo Preview</title>
    <link rel="stylesheet" href="../web/style-guide/fonts.css?v=20260830">
    <link
      rel="stylesheet"
      href="../web/style-guide/fontawesome.min.css?v=20260830"
   >
    <link rel="stylesheet" href="../web/shared-components.css?v=20260831o">
    <link rel="stylesheet" href="preview.css?v=20260830">
  </head>
  <body>
    <header class="logo-preview-header">
      <nav
        class="logo-preview-header-inner"
        aria-label="Logo preview navigation"
      >
        <a
          class="logo-preview-brand"
          href="./index.html"
          aria-label="Grayhaven Systems LLC logo preview home"
        >
          <img
            src="svg/grayhaven-logo-wordmark-dark.svg"
            alt="Grayhaven Systems LLC"
         >
        </a>
        <a
          class="button button-secondary logo-preview-source"
          href="../docs/logo-usage.md"
          aria-label="Back to Logo Usage"
        >
          <i class="fa-solid fa-arrow-left" aria-hidden="true"></i>
          <span>Back to Logo Usage</span>
        </a>
      </nav>
    </header>
    <main class="logo-preview-main">
      <header class="logo-preview-intro">
        <p class="eyebrow">LOGO PREVIEW</p>
        <h1>Grayhaven Systems LLC logos</h1>
        <p class="muted">
          Approved wordmark and monogram assets on their intended light and dark
          surfaces.
        </p>
      </header>
      <div class="logo-preview-grid">
        <section
          class="logo-preview-card logo-preview-card-light"
          aria-labelledby="light-wordmark-title"
        >
          <h2 id="light-wordmark-title">Wordmark on a light background</h2>
          <div class="logo-preview-artwork">
            <img
              src="svg/grayhaven-logo-wordmark-light.svg"
              alt="Grayhaven Systems LLC light-background wordmark"
           >
          </div>
        </section>
        <section
          class="logo-preview-card"
          aria-labelledby="dark-wordmark-title"
        >
          <h2 id="dark-wordmark-title">Wordmark on a dark background</h2>
          <div class="logo-preview-artwork">
            <img
              src="svg/grayhaven-logo-wordmark-dark.svg"
              alt="Grayhaven Systems LLC dark-background wordmark"
           >
          </div>
        </section>
        <section
          class="logo-preview-card logo-preview-card-light"
          aria-labelledby="light-monogram-title"
        >
          <h2 id="light-monogram-title">Monogram on a light background</h2>
          <div class="logo-preview-artwork">
            <img
              class="monogram"
              src="svg/grayhaven-logo-monogram.svg"
              alt="Grayhaven Systems LLC monogram on a light background"
           >
          </div>
        </section>
        <section
          class="logo-preview-card"
          aria-labelledby="dark-monogram-title"
        >
          <h2 id="dark-monogram-title">Monogram on a dark background</h2>
          <div class="logo-preview-artwork">
            <img
              class="monogram"
              src="svg/grayhaven-logo-monogram.svg"
              alt="Grayhaven Systems LLC monogram on a dark background"
           >
          </div>
        </section>
      </div>
    </main>
  </body>
</html>
