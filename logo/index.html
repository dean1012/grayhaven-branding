<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Grayhaven Logo Variant Preview</title>
    <style>
      :root {
        --deep-graphite: #1c1f24;
        --gunmetal: #2a2f36;
        --slate-grey: #353b44;
        --soft-white: #e6eaf0;
        --cool-grey: #aab2bf;
        --border: #444c56;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 2rem;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        color: var(--soft-white);
        background: #15181d;
      }

      h1 {
        margin: 0 0 1.5rem;
        font-size: 1.5rem;
      }

      .grid {
        display: grid;
        gap: 1rem;
        grid-template-columns: repeat(auto-fit, minmax(22rem, 1fr));
      }

      .panel {
        min-height: 18rem;
        padding: 1.25rem;
        border: 1px solid var(--border);
        border-radius: 8px;
      }

      .light {
        color: #1c1f24;
        background: linear-gradient(180deg, #f5f7fa, #dce2ea);
      }

      .dark {
        background:
          linear-gradient(180deg, rgba(42, 47, 54, 0.94), rgba(34, 38, 44, 0.9)),
          var(--gunmetal);
      }

      .label {
        margin: 0 0 1rem;
        color: inherit;
        font-size: 0.85rem;
        opacity: 0.72;
      }

      .wordmark {
        display: block;
        width: min(100%, 34rem);
        height: auto;
        margin: 3rem auto;
      }

      .profile {
        display: block;
        width: min(45%, 12rem);
        height: auto;
        margin: 2rem auto;
      }
    </style>
  </head>
  <body>
    <h1>Grayhaven Logo Variant Preview</h1>
    <main class="grid">
      <section class="panel light">
        <p class="label">Wordmark light-background variant</p>
        <img class="wordmark" src="svg/grayhaven-logo-wordmark-light.svg" alt="Grayhaven wordmark light-background variant">
      </section>
      <section class="panel dark">
        <p class="label">Wordmark dark-background variant</p>
        <img class="wordmark" src="svg/grayhaven-logo-wordmark-dark.svg" alt="Grayhaven wordmark dark-background variant">
      </section>
      <section class="panel light">
        <p class="label">Profile canonical variant on light background</p>
        <img class="profile" src="svg/grayhaven-logo-monogram.svg" alt="Grayhaven profile logo canonical variant on light background">
      </section>
      <section class="panel dark">
        <p class="label">Profile canonical variant on dark background</p>
        <img class="profile" src="svg/grayhaven-logo-monogram.svg" alt="Grayhaven profile logo canonical variant on dark background">
      </section>
    </main>
  </body>
</html>
