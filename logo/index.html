<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Grayhaven Systems LLC Logo Preview</title>
    <link rel="stylesheet" href="../web/style-guide/fonts.css?v=20260712">
    <link rel="stylesheet" href="../web/style-guide/fontawesome.min.css?v=20260712">
    <link rel="stylesheet" href="../web/style-guide/style-guide.css?v=20260712">
  </head>
  <body>
    <header class="site-header">
      <nav class="navbar" aria-label="Logo preview navigation">
        <div class="navbar-brand">
          <a href="./index.html" aria-label="Grayhaven Systems LLC logo preview home">
            <img
              class="navbar-logo"
              src="svg/grayhaven-logo-wordmark-dark.svg"
              alt="Grayhaven Systems LLC">
          </a>
        </div>
        <a class="link-button navbar-contact" href="../docs/logo-usage.md">
          <i class="fa-solid fa-arrow-left" aria-hidden="true"></i>
          <span>Back to Logo Usage</span>
        </a>
      </nav>
    </header>
    <main class="logo-preview-main">
      <h1>Grayhaven Systems LLC Logo Preview</h1>
      <div class="logo-preview-grid">
        <section class="logo-preview-card light" aria-labelledby="light-wordmark-title">
          <h2 id="light-wordmark-title">Wordmark on a light background</h2>
          <img src="svg/grayhaven-logo-wordmark-light.svg" alt="Grayhaven Systems LLC light-background wordmark">
        </section>
        <section class="logo-preview-card" aria-labelledby="dark-wordmark-title">
          <h2 id="dark-wordmark-title">Wordmark on a dark background</h2>
          <img src="svg/grayhaven-logo-wordmark-dark.svg" alt="Grayhaven Systems LLC dark-background wordmark">
        </section>
        <section class="logo-preview-card light" aria-labelledby="light-monogram-title">
          <h2 id="light-monogram-title">Monogram on a light background</h2>
          <img class="monogram" src="svg/grayhaven-logo-monogram.svg" alt="Grayhaven Systems LLC monogram on a light background">
        </section>
        <section class="logo-preview-card" aria-labelledby="dark-monogram-title">
          <h2 id="dark-monogram-title">Monogram on a dark background</h2>
          <img class="monogram" src="svg/grayhaven-logo-monogram.svg" alt="Grayhaven Systems LLC monogram on a dark background">
        </section>
      </div>
    </main>
  </body>
</html>
